name: Screenshot

on:
  workflow_dispatch:
    inputs:
      screen:
        description: 'Schermata da fotografare (settings)'
        default: 'settings'

jobs:
  screenshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - uses: gradle/actions/setup-gradle@v4

      - name: Compila
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug
          cp app/build/outputs/apk/debug/app-debug.apk app.apk

      - name: Abilita KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Fotografa la schermata
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          profile: pixel_6
          disable-animations: true
          script: |
            adb install -r app.apk
            adb shell am start -n io.github.mattcoc.cvnext/com.example.classevivamodernaemeglio.MainActivity --es debugScreen ${{ github.event.inputs.screen || 'settings' }}
            sleep 12
            adb exec-out screencap -p > shot1.png
            adb shell input swipe 540 1900 540 500 400
            sleep 2
            adb shell input swipe 540 1900 540 500 400
            sleep 3
            adb exec-out screencap -p > shot2.png
            adb shell input swipe 540 1900 540 300 400
            sleep 1
            adb shell input swipe 540 1900 540 300 400
            sleep 3
            adb exec-out screencap -p > shot3.png
            adb logcat -d -b crash

      - name: Stampa gli screenshot nel log
        run: |
          pip install --quiet pillow
          for f in shot1 shot2 shot3; do
            python3 -c "from PIL import Image; im=Image.open('$f.png').convert('RGB'); im.resize((540, im.height*540//im.width)).save('$f.jpg', quality=85)"
            echo "=== BEGIN $f ==="
            base64 -w 0 $f.jpg
            echo
            echo "=== END $f ==="
          done

      - uses: actions/upload-artifact@v4
        with:
          name: screenshots
          path: shot*.png
