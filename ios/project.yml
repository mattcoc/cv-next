name: CVNext
options:
  bundleIdPrefix: io.github.mattcoc
  deploymentTarget:
    iOS: "26.0"
  developmentLanguage: it
settings:
  base:
    MARKETING_VERSION: "1.6.10"
    CURRENT_PROJECT_VERSION: "12"
    SWIFT_VERSION: "5.0"
    TARGETED_DEVICE_FAMILY: "1,2"
targets:
  CVNext:
    type: application
    platform: iOS
    sources: [CVNext]
    scheme: {}
    info:
      path: CVNext/Info.plist
      properties:
        CFBundleDisplayName: CV Next
        CFBundleDevelopmentRegion: it
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        UISupportedInterfaceOrientations~ipad: [UIInterfaceOrientationPortrait, UIInterfaceOrientationPortraitUpsideDown, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
        UIBackgroundModes: [fetch]
        NSFaceIDUsageDescription: Per bloccare CV Next con Face ID, se lo attivi nelle impostazioni.
        NSCalendarsWriteOnlyAccessUsageDescription: Per aggiungere verifiche e interrogazioni al tuo calendario.
        UIApplicationShortcutItems:
          - UIApplicationShortcutItemType: grades
            UIApplicationShortcutItemTitle: Voti
            UIApplicationShortcutItemIconSymbolName: star.fill
          - UIApplicationShortcutItemType: day
            UIApplicationShortcutItemTitle: Giornata
            UIApplicationShortcutItemIconSymbolName: calendar
          - UIApplicationShortcutItemType: homework
            UIApplicationShortcutItemTitle: Compiti
            UIApplicationShortcutItemIconSymbolName: pencil.and.list.clipboard
          - UIApplicationShortcutItemType: tests
            UIApplicationShortcutItemTitle: Verifiche
            UIApplicationShortcutItemSubtitle: Verifiche e interrogazioni
            UIApplicationShortcutItemIconSymbolName: list.bullet.clipboard
        BGTaskSchedulerPermittedIdentifiers: [io.github.mattcoc.cvnext.check]
        ITSAppUsesNonExemptEncryption: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.github.mattcoc.cvnext
        PRODUCT_NAME: CVNext
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        CODE_SIGN_STYLE: Automatic
        ENABLE_PREVIEWS: YES
