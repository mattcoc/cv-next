name: Release APK

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Versione da pubblicare, solo il numero (es. v1.1)'
        required: true

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Controlla la versione
        env:
          RAW: ${{ github.event.inputs.version || github.ref_name }}
        run: |
          NUM=$(echo "$RAW" | grep -oE '[0-9]+(\.[0-9]+)*' | tail -1 || true)
          if [ -z "$NUM" ]; then
            echo "::error::Versione non valida: '$RAW'. Scrivi solo il numero, per esempio v1.1"
            exit 1
          fi
          echo "VERSION=v$NUM" >> "$GITHUB_ENV"
          echo "Versione: v$NUM"

      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - uses: gradle/actions/setup-gradle@v4

      - name: Compila APK
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace
          cp app/build/outputs/apk/debug/app-debug.apk "cv-next-$VERSION.apk"

      - name: Firma con la chiave del progetto
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::warning::Secret KEYSTORE_BASE64 assente: l'APK resta firmato con una chiave di debug temporanea"
            exit 0
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/cv-next.jks"
          APKSIGNER=$(ls -d "$ANDROID_HOME"/build-tools/*/ | sort -V | tail -1)apksigner
          "$APKSIGNER" sign --ks "$RUNNER_TEMP/cv-next.jks" --ks-pass env:KEYSTORE_PASSWORD \
            --ks-key-alias "$KEY_ALIAS" --key-pass env:KEYSTORE_PASSWORD "cv-next-$VERSION.apk"
          "$APKSIGNER" verify --print-certs "cv-next-$VERSION.apk"
          rm "$RUNNER_TEMP/cv-next.jks"

      - name: Pubblica release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.VERSION }}
          name: CV Next ${{ env.VERSION }}
          target_commitish: ${{ github.sha }}
          files: cv-next-${{ env.VERSION }}.apk
          body: |
            APK di CV Next ${{ env.VERSION }}.

            Scarica `cv-next-${{ env.VERSION }}.apk`, aprilo sul telefono e consenti l'installazione da origini sconosciute. Serve Android 8.0 o superiore.
