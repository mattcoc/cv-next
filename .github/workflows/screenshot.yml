name: Screenshot

on:
  workflow_dispatch:
    inputs:
      screen:
        description: 'Schermate da fotografare, separate da spazio (settings grades today absences)'
        default: 'settings'
      extras:
        description: 'Opzioni in più, es. --es debugSeed Rosso --ei debugMode 2'
        default: ''

jobs:
  screenshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - uses: gradle/actions/setup-gradle@v4

      - name: Compila
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug
          cp app/build/outputs/apk/debug/app-debug.apk app.apk

      - name: Abilita KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Fotografa la schermata
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          profile: pixel_6
          disable-animations: true
          script: |
            adb install -r app.apk
            for screen in ${{ github.event.inputs.screen || 'settings' }}; do adb shell am start -S -n io.github.mattcoc.cvnext/com.example.classevivamodernaemeglio.MainActivity --es debugScreen $screen ${{ github.event.inputs.extras }}; sleep 10; adb exec-out screencap -p > ${screen}_1.png; adb shell input swipe 540 1900 540 600 400; sleep 3; adb exec-out screencap -p > ${screen}_2.png; done
            adb logcat -d -b crash

      - name: Stampa gli screenshot nel log
        run: |
          pip install --quiet pillow
          for p in *_1.png *_2.png; do
            f=${p%.png}
            python3 -c "from PIL import Image; im=Image.open('$f.png').convert('RGB'); im.resize((540, im.height*540//im.width)).save('$f.jpg', quality=85)"
            echo "=== BEGIN $f ==="
            base64 -w 0 $f.jpg
            echo
            echo "=== END $f ==="
          done

      - uses: actions/upload-artifact@v4
        with:
          name: screenshots
          path: '*.png'
