name: iOS

on:
  push:
    branches: [ios]
    paths: ['ios/**', '.github/workflows/ios.yml']
  workflow_dispatch:
    inputs:
      screens:
        description: 'Schermate da fotografare, separate da spazio'
        default: 'today day grades subject agenda notices functions absences settings login loginAdd'

permissions:
  contents: write

concurrency:
  group: ios
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4

      - name: Genera il progetto Xcode
        run: |
          brew install xcodegen
          cd ios && xcodegen generate
          xcodebuild -version

      - name: Scegli il simulatore
        run: |
          UDID=$(xcrun simctl list devices available -j | python3 -c "
          import json, sys
          d = json.load(sys.stdin)['devices']
          phones = [x for k, v in d.items() if 'iOS' in k for x in v if x['name'].startswith('iPhone') and 'Pro' in x['name'] and 'Max' not in x['name']]
          phones = phones or [x for k, v in d.items() if 'iOS' in k for x in v if x['name'].startswith('iPhone')]
          print(phones[-1]['udid'])")
          echo "UDID=$UDID" >> $GITHUB_ENV
          xcrun simctl list devices | grep "$UDID"

      - name: Compila per il simulatore
        run: |
          cd ios
          xcodebuild -project CVNext.xcodeproj -scheme CVNext -configuration Debug \
            -destination "platform=iOS Simulator,id=$UDID" -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO build -quiet

      - name: Compila per iPhone (IPA non firmata)
        run: |
          cd ios
          # Le prime IPA avevano build 12: si parte da 100 così risultano tutte più vecchie.
          xcodebuild -project CVNext.xcodeproj -scheme CVNext -configuration Release \
            -destination "generic/platform=iOS" -derivedDataPath build \
            CURRENT_PROJECT_VERSION=$((100 + GITHUB_RUN_NUMBER)) \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO build -quiet
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/CVNext.app Payload/
          zip -qr CVNext.ipa Payload

      - uses: actions/upload-artifact@v4
        with:
          name: CVNext-ipa
          path: ios/CVNext.ipa

      # Pre-release, così l'aggiornamento in-app di Android (releases/latest) non la vede.
      - name: Pubblica l'IPA nella release ios
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Il vecchio tag "ios" aveva lo stesso nome del branch e confondeva git.
          gh release delete ios --cleanup-tag -y 2>/dev/null || true
          gh release view ios-latest >/dev/null 2>&1 || gh release create ios-latest --prerelease --latest=false --target ios \
            --title "CV Next per iOS (anteprima)" \
            --notes "IPA non firmata, da installare con SideStore o AltStore. Richiede iOS 26 o successivo. Si aggiorna a ogni modifica del branch ios."
          gh release upload ios-latest ios/CVNext.ipa --clobber
          # L'app legge il numero di build dalle note per sapere se c'è una versione nuova.
          gh release edit ios-latest --notes "IPA non firmata, da installare con SideStore o AltStore. Richiede iOS 26 o successivo. Si aggiorna a ogni modifica del branch ios.

          Build $((100 + GITHUB_RUN_NUMBER))"

      - name: Fotografa le schermate
        run: |
          xcrun simctl boot "$UDID"
          xcrun simctl bootstatus "$UDID"
          xcrun simctl status_bar "$UDID" override --time 9:41 --batteryLevel 100 --cellularBars 4
          xcrun simctl install "$UDID" ios/build/Build/Products/Debug-iphonesimulator/CVNext.app
          mkdir -p shots
          for mode in light dark; do
            xcrun simctl ui "$UDID" appearance $mode
            for screen in ${{ github.event.inputs.screens || 'today day grades subject agenda notices functions absences settings login loginAdd' }}; do
              xcrun simctl terminate "$UDID" io.github.mattcoc.cvnext 2>/dev/null || true
              xcrun simctl launch "$UDID" io.github.mattcoc.cvnext -debugScreen $screen
              sleep 6
              xcrun simctl io "$UDID" screenshot shots/${screen}_${mode}.png
            done
          done
          # Le stesse schermate principali su iPad, in orizzontale non serve: basta verticale chiaro e scuro.
          IPAD=$(xcrun simctl list devices available -j | python3 -c "
          import json, sys
          d = json.load(sys.stdin)['devices']
          pads = [x for k, v in d.items() if 'iOS' in k for x in v if x['name'].startswith('iPad Pro')] or [x for k, v in d.items() if 'iOS' in k for x in v if x['name'].startswith('iPad')]
          print(pads[-1]['udid'] if pads else '')")
          if [ -n "$IPAD" ]; then
            xcrun simctl boot "$IPAD"
            xcrun simctl bootstatus "$IPAD"
            xcrun simctl status_bar "$IPAD" override --time 9:41 --batteryLevel 100
            xcrun simctl install "$IPAD" ios/build/Build/Products/Debug-iphonesimulator/CVNext.app
            for mode in light dark; do
              xcrun simctl ui "$IPAD" appearance $mode
              for screen in today grades settings login; do
                xcrun simctl terminate "$IPAD" io.github.mattcoc.cvnext 2>/dev/null || true
                xcrun simctl launch "$IPAD" io.github.mattcoc.cvnext -debugScreen $screen
                sleep 6
                xcrun simctl io "$IPAD" screenshot shots/ipad_${screen}_${mode}.png
              done
            done
          fi

      - name: Salva gli screenshot nel branch
        run: |
          mkdir -p jpg
          for p in shots/*.png; do
            f=$(basename "${p%.png}")
            sips -Z 1000 -s format jpeg -s formatOptions 75 "$p" --out "jpg/$f.jpg" >/dev/null
          done
          # Parte dall'ultima versione del branch, così non ci sono conflitti con altre run.
          git fetch origin refs/heads/ios:refs/remotes/origin/ios
          git checkout -B ios refs/remotes/origin/ios
          mkdir -p ios/screenshots
          cp jpg/*.jpg ios/screenshots/
          git config user.name "Matteo"
          git config user.email "matteorubin1234@gmail.com"
          git add ios/screenshots
          if ! git diff --cached --quiet; then
            git commit -m "Screenshot iOS [skip ci]"
            git push origin HEAD:refs/heads/ios
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: screenshots
          path: shots/*.png
