name: Release APK

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Versione da pubblicare (es. v1.0)'
        required: true

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ github.event.inputs.version || github.ref_name }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - uses: gradle/actions/setup-gradle@v4

      - name: Compila APK
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace
          cp app/build/outputs/apk/debug/app-debug.apk "cv-next-$VERSION.apk"

      - name: Pubblica release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.VERSION }}
          name: CV Next ${{ env.VERSION }}
          target_commitish: ${{ github.sha }}
          files: cv-next-${{ env.VERSION }}.apk
          body: |
            APK di CV Next ${{ env.VERSION }}.

            Scarica `cv-next-${{ env.VERSION }}.apk`, aprilo sul telefono e consenti l'installazione da origini sconosciute. Serve Android 8.0 o superiore.
